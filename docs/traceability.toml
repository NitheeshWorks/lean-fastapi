# Traceability register: upstream behaviour -> Lean symbol -> theorem -> test.
#
# `scripts/traceability-check.py` validates it on every CI run: every
# `realises`/`theorem` symbol must resolve, every `test` path must exist.
#
# status: implemented | partial | tested | excluded | deviation
#   implemented  realised and proved
#   partial      realised, proof incomplete or covering a subset
#   tested       realised, deliberately tested rather than proved (say why)
#   excluded     out of scope, rejected by name
#   deviation    behaviour differs from upstream on purpose (say how)

[meta]
upstream_name = "FastAPI"
upstream_url = "https://github.com/fastapi/fastapi"
upstream_commit = "b23d78f2ce4e7b3ea48a59f51ca249690d9fd02c"
upstream_license = "MIT"

# [[requirement]]
# id = "..."                  # stable id, e.g. "routing.first-match"
# upstream = "tests/test_x.py::test_y"   # or a docs section
# title = "..."
# status = "implemented"
# realises = ["LeanFastapi.Foo.bar"]
# theorem = ["LeanFastapi.Foo.bar_spec"]
# test = ["tests/Conformance.lean::name"]

[[requirement]]
id = "params.inference"
upstream = "fastapi/dependencies/utils.py::analyze_param"
title = "A name in the path template is a path parameter, a model is the body, anything else is a query parameter; Path/Query/Header/Cookie/Body override"
status = "implemented"
realises = ["LeanFastapi.inferParam", "LeanFastapi.Path", "LeanFastapi.Query", "LeanFastapi.Header", "LeanFastapi.Cookie", "LeanFastapi.Body"]
theorem = ["LeanFastapi.infer_param", "LeanFastapi.infer_param_explicit"]
test = ["tests/Conformance.lean", "tests/apps/QueryParams001.lean"]

[[requirement]]
id = "params.header-alias"
upstream = "fastapi/params.py::Header (convert_underscores)"
title = "A header parameter is read under its name with underscores written as hyphens"
status = "implemented"
realises = ["LeanFastapi.headerAlias", "LeanFastapi.headerParamAlias"]
theorem = ["LeanFastapi.header_alias_hyphen"]
test = ["tests/apps/HeaderParams001.lean", "tests/apps/HeaderParams002.lean", "tests/Props.lean"]

[[requirement]]
id = "params.locations"
upstream = "fastapi/dependencies/utils.py::request_params_to_args"
title = "Every validation error of a parameter is located under (source, alias)"
status = "implemented"
realises = ["LeanFastapi.Param.validator", "LeanFastapi.Params.cons"]
theorem = ["LeanFastapi.params_to_args_loc", "LeanFastapi.extract_sound", "LeanFastapi.extract_cons_ok_iff"]
test = ["tests/Conformance.lean"]

[[requirement]]
id = "params.422"
upstream = "fastapi/exception_handlers.py::request_validation_exception_handler"
title = "Failed extraction answers 422 with {\"detail\": errors}, errors grouped path, query, header, cookie, body"
status = "implemented"
realises = ["LeanFastapi.request_validation_exception_handler", "LeanFastapi.RequestValidationError"]
theorem = ["LeanFastapi.extract_422", "LeanFastapi.endpoint_app_errors"]
test = ["tests/Conformance.lean", "tests/apps/Qpsv003.lean", "tests/apps/Ppnv006.lean"]

[[requirement]]
id = "params.model-attributes-type"
