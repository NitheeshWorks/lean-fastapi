title = "app.dependency_overrides: the dependant gets the override's value (any type, the dependency's own), on the override's arguments, under the dependency's cache key and scope; overrides apply inside an override's tree"
status = "implemented"
realises = ["LeanFastapi.Dep.call", "LeanFastapi.Dep.Override", "LeanFastapi.FastAPI.overrideDependency", "LeanFastapi.FastAPI.clearOverrides", "LeanFastapi.Macro.subOf"]
