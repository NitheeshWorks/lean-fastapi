    name = "LeanFastapi"
    version = "0.1.0"
    defaultTargets = ["LeanFastapi", "props", "conformance", "example"]

    # The verified library. Everything under LeanFastapi/ except Transport.lean is a
    # total function and the proof surface; see CONTRIBUTING.md.
    [[lean_lib]]
    name = "LeanFastapi"

    # Property tests for what is tested rather than proved. No dependencies, runs
    # in well under a second: `lake exe props [seed]`.
    [[lean_exe]]
    name = "props"
    root = "tests.Props"

    # Conformance cases re-expressed from the upstream test suite:
    # `lake exe conformance`. Each case names the upstream test it mirrors.
    [[lean_exe]]
    name = "conformance"
    root = "tests.Conformance"

# Keel directly, so this repo chooses the theory library's pin over an
# older one in a dependency's manifest.
[[require]]
name = "Keel"
git = "https://github.com/NitheeshWorks/lean-keel"
rev = "main"

# lean-json directly: the library builds JSON itself (json%, the OpenAPI
# document), so its pin is this repo's choice.
[[require]]
name = "LeanJson"
git = "https://github.com/NitheeshWorks/lean-json"
rev = "main"

[[require]]
name = "LeanPydantic"
git = "https://github.com/NitheeshWorks/lean-pydantic"
rev = "main"

[[require]]
name = "LeanStarlette"
git = "https://github.com/NitheeshWorks/lean-starlette"
rev = "main"

[[require]]
name = "LeanClick"
git = "https://github.com/NitheeshWorks/lean-click"
rev = "main"

# The milestone 1 demo on 127.0.0.1:8000: `lake exe example`.
[[lean_exe]]
name = "example"
root = "demo.Example"

# The Lean twins of the conformance fixtures (upstream tutorial apps) and the
# demo application, built as a library so the test runner and the demo
# executable import them.
[[lean_lib]]
name = "Fixtures"
globs = ["tests.apps.+", "demo.App"]
